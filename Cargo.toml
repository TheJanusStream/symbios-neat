[package]
name = "symbios-neat"
version = "0.2.0"
edition = "2021"
authors = ["Janus"]
description = "NEAT engine for morphogenetic engineering with CPPN support"
license = "MIT"
repository = "https://github.com/TheJanusStream/symbios-neat"
keywords = [
    "neat",
    "neuroevolution",
    "cppn",
    "genetic-algorithm",
    "neural-network",
]
categories = ["science", "algorithms", "simulation"]

[dependencies]
symbios-genetics = {path="../symbios-genetics"}
serde = { version = "1.0", features = ["derive"] }
rand = "0.9"
slotmap = { version = "1.0", features = ["serde"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rand_chacha = "0.9"
serde_json = "1.0"

[[bench]]
name = "neat_bench"
harness = false

[features]
default = []

# Enable PNG export via [`CppnEvaluator::generate_image`]. Pulls in the `image`
# crate; PNG codec only.
image = ["dep:image"]
